name: UDP regression on macOS
permissions:
  contents: read

on:
  push:
    branches: [ ci/udp-forwarder ]

jobs:
  udp:
    runs-on: macos-26

    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Apple silicon and toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version

      - name: Run UDP forwarding regression
        run: swift test --filter UDPForwarderTest
